name: Personal workflow validation
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
      - name: Check known dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: node --experimental-strip-types --test --test-isolation=none tests/*.test.ts tests/signout.cjs
      - run: node tests/optional-lineups-sql.cjs
      - run: node tests/team-beverage-sql.cjs
      - run: node tests/manager-beverage-sql.cjs
      - run: node --experimental-strip-types tests/extended-outcomes-sql.cjs
      - run: node tests/archive-lifecycle-sql.cjs
      - run: WITH_EXTENDED=1 node tests/archive-lifecycle-sql.cjs
      - run: node tests/tournament-start-time-sql.cjs
      - run: node tests/hit-types-sql.cjs
      - run: node tests/roster-actions.cjs
      - run: node tests/roster-membership-sql.cjs
      - run: node tests/personal-alibis-sql.cjs
      - run: node tests/dashboard-loader.cjs
      - run: node tests/password-reset.cjs
      - run: node tests/feedback-api.cjs
      - run: node tests/feedback-sql.cjs
      - name: Prepare reliable Ubuntu package downloads
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # Retain Ubuntu's signed sources; avoid the slow Azure mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::https::Timeout "30";' 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
      - run: npx playwright install --with-deps chromium webkit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: node tests/personal-workflow-browser.cjs
      - run: node tests/home-layout-browser.cjs
      - run: BROWSER_ENGINE=webkit node tests/home-layout-browser.cjs
      - run: node tests/games-flow-browser.cjs
      - run: BROWSER_ENGINE=webkit node tests/games-flow-browser.cjs
      - run: node tests/archive-controls-browser.cjs
      - run: BROWSER_ENGINE=webkit node tests/archive-controls-browser.cjs
      - run: node tests/tournament-start-time-browser.cjs
      - run: BROWSER_ENGINE=webkit node tests/tournament-start-time-browser.cjs
      - run: node tests/roster-membership-browser.cjs
      - run: BROWSER_ENGINE=webkit node tests/roster-membership-browser.cjs
      - run: node tests/beverage-controls-browser.cjs
      - run: BROWSER_ENGINE=webkit node tests/beverage-controls-browser.cjs
      - run: node tests/scorebook-modes-browser.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: BROWSER_ENGINE=webkit node tests/scorebook-modes-browser.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run test:connected-scorebook
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run build:worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: node tests/game-day-review-browser.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: BROWSER_ENGINE=webkit node tests/game-day-review-browser.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: node tests/personal-pages-browser.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: BROWSER_ENGINE=webkit node tests/personal-pages-browser.cjs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
